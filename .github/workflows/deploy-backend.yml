name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  SERVICE_NAME: dcka-chatbot-backend
  REGION: asia-east1
  CONTENT_URL: https://caocharles.github.io/dcka-class-notes/content.json
  DOCUMENT_CACHE_SECONDS: "3600"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source backend \
            --region "${{ env.REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --build-service-account "${{ vars.GCP_BUILD_SA }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},CONTENT_URL=${{ env.CONTENT_URL }},DOCUMENT_CACHE_SECONDS=${{ env.DOCUMENT_CACHE_SECONDS }}" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format "value(status.url)"
